openapi: 3.1.0
info:
  title: Wattson Backend API
  version: 0.1.0
  description: The small contract between the Wattson web app and planning service.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The backend is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    get:
      operationId: streamEvents
      responses:
        "200":
          description: A basic server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
  /v1/demo/operators:
    get:
      operationId: listDemoOperators
      responses:
        "200":
          description: The seeded operators and their site summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoOperator"
  /v1/demo/sites/{site_id}/scenario:
    get:
      operationId: getDemoScenario
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The site's validated 24-hour planning scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: The site does not have a seeded scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sites:
    get:
      operationId: listSites
      description: Lists the latest persisted scenario for each site with capacity and latest plan metrics.
      responses:
        "200":
          description: The persisted sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteSummary" }
    post:
      operationId: createSite
      description: Creates a site with a starter solar grid and a validated 24-hour scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: The created site summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSummary" }
        "400":
          description: The site input is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A site with this generated ID already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sites/{site_id}:
    get:
      operationId: getSite
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The site, its current scenario, counts, and latest plan summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteOverview" }
        "404":
          description: The site does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sites/{site_id}/forecast:
    get:
      operationId: getSiteForecast
      description: Returns a live or cached seven-day Open-Meteo forecast and asset-specific operating actions.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The normalized weather forecast. A stale cache is returned only when Open-Meteo fails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "404":
          description: The site does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Open-Meteo failed and no cached forecast exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/scenarios/{scenario_id}:
    get:
      operationId: getScenario
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The current revision of the scenario input for planning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: replaceScenario
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scenario"
      responses:
        "200":
          description: The full validated replacement scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is invalid or its ID does not match the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteScenario
      description: Deletes the scenario and all plan runs that belong to it.
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: The scenario and its plan runs were deleted.
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/connections:
    put:
      operationId: replaceScenarioConnections
      description: Replaces the complete directed connection graph and increments the scenario revision.
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionsRequest"
      responses:
        "200":
          description: The updated full scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The connection graph is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios:
    get:
      operationId: listScenarios
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The available scenario revisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioSummary"
        "400":
          description: A pagination value is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scenario"
      responses:
        "201":
          description: The validated scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The scenario body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A scenario uses this ID already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/signals/{signal_id}:
    put:
      operationId: replaceScenarioSignalValues
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
        - name: signal_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalValuesUpdate"
      responses:
        "200":
          description: The scenario with the validated signal values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The values make the scenario invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario or signal does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/initial-state:
    put:
      operationId: replaceScenarioInitialState
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialState"
      responses:
        "200":
          description: The scenario with the validated battery and fuel state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The initial state makes the scenario invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/events:
    post:
      operationId: createScenarioEvent
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioEvent"
      responses:
        "201":
          description: The scenario with the new event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The event makes the scenario invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An event uses this ID already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/events/{event_id}:
    delete:
      operationId: deleteScenarioEvent
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: The event was removed from the scenario.
        "404":
          description: The scenario or event does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plan-runs:
    post:
      operationId: createPlanRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningRequest"
      responses:
        "201":
          description: The completed or infeasible plan run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRun"
        "400":
          description: The request body or parent run is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The scenario does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The parent baseline uses a different scenario revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The scenario or active event selection cannot be planned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plan-runs/{run_id}:
    get:
      operationId: getPlanRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A persisted plan run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRun"
        "404":
          description: The plan run does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The plan run or its parent comparison could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plan-runs/{run_id}/comparison:
    get:
      operationId: getPlanRunComparison
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A measured comparison with the persisted baseline parent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanComparison"
        "404":
          description: The plan run does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The plan run does not have a baseline parent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The run or its parent comparison could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/scenarios/{scenario_id}/plan-runs:
    get:
      operationId: listPlanRuns
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The newest plan runs for the scenario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanRun"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service: { type: string }
        status: { type: string, const: ok }
        version: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    DemoOperator:
      type: object
      additionalProperties: false
      required: [id, name, role, site]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        site:
          $ref: "#/components/schemas/DemoSiteSummary"
    DemoSiteSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - location
        - timezone
        - peak_demand_kw
        - solar_capacity_kw
        - wind_capacity_kw
        - battery_capacity_kwh
        - diesel_capacity_kw
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        timezone: { type: string }
        peak_demand_kw: { type: number }
        solar_capacity_kw: { type: number }
        wind_capacity_kw: { type: number }
        battery_capacity_kwh: { type: number }
        diesel_capacity_kw: { type: number }
    SiteScenarioIdentity:
      type: object
      additionalProperties: false
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        revision: { type: integer, minimum: 1 }
        horizon: { $ref: "#/components/schemas/PlanningHorizon" }
    SiteCapacity:
      type: object
      additionalProperties: false
      required: [solar_kw, wind_kw, battery_kwh, diesel_kw]
      properties:
        solar_kw: { type: number, minimum: 0 }
        wind_kw: { type: number, minimum: 0 }
        battery_kwh: { type: number, minimum: 0 }
        diesel_kw: { type: number, minimum: 0 }
    LatestRunSummary:
      type: object
      additionalProperties: false
      required: [id, scenario_id, planner, status, created_at, summary]
      properties:
        id: { type: string }
        scenario_id: { type: string }
        planner: { type: string, enum: [baseline, wattson] }
        status: { type: string, enum: [computing, complete, infeasible, failed] }
        created_at: { type: string, format: date-time }
        summary: { $ref: "#/components/schemas/PlanSummary" }
    SiteSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          location,
          timezone,
          currency,
          current_scenario,
          capacity,
          service_count,
          commitment_count,
          event_count,
          latest_run,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        timezone: { type: string }
        currency: { type: string }
        current_scenario: { $ref: "#/components/schemas/SiteScenarioIdentity" }
        capacity: { $ref: "#/components/schemas/SiteCapacity" }
        service_count: { type: integer, minimum: 0 }
        commitment_count: { type: integer, minimum: 0 }
        event_count: { type: integer, minimum: 0 }
        latest_run:
          oneOf:
            - { $ref: "#/components/schemas/LatestRunSummary" }
            - { type: "null" }
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, location, timezone, currency, solar_capacity_kw, peak_demand_kw]
      properties:
        name: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        solar_capacity_kw: { type: number, exclusiveMinimum: 0 }
        peak_demand_kw: { type: number, exclusiveMinimum: 0 }
    SiteOverview:
      type: object
      additionalProperties: false
      required:
        [site, current_scenario, commitment_count, event_count, active_event_count, latest_run]
      properties:
        site: { $ref: "#/components/schemas/Site" }
        current_scenario: { $ref: "#/components/schemas/SiteScenarioIdentity" }
        commitment_count: { type: integer, minimum: 0 }
        event_count: { type: integer, minimum: 0 }
        active_event_count: { type: integer, minimum: 0 }
        latest_run:
          oneOf:
            - { $ref: "#/components/schemas/LatestRunSummary" }
            - { type: "null" }
    ForecastLocation:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude, timezone]
      properties:
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        timezone: { type: string }
    ForecastProvider:
      type: object
      additionalProperties: false
      required: [name, url, fetched_at, cache_status]
      properties:
        name: { type: string, const: Open-Meteo }
        url: { type: string, format: uri }
        fetched_at: { type: string, format: date-time }
        cache_status: { type: string, enum: [live, fresh_cache, stale_cache] }
    CurrentWeather:
      type: object
      additionalProperties: false
      required:
        [
          time,
          temperature_c,
          apparent_temperature_c,
          precipitation_mm,
          cloud_cover_percent,
          wind_speed_kph,
          wind_direction_degrees,
          weather_code,
          condition,
          is_day,
        ]
      properties:
        time: { type: string }
        temperature_c: { type: number }
        apparent_temperature_c: { type: number }
        precipitation_mm: { type: number, minimum: 0 }
        cloud_cover_percent: { type: number, minimum: 0, maximum: 100 }
        wind_speed_kph: { type: number, minimum: 0 }
        wind_direction_degrees: { type: number, minimum: 0, maximum: 360 }
        weather_code: { type: integer }
        condition: { type: string }
        is_day: { type: boolean }
    HourlyWeather:
      type: object
      additionalProperties: false
      required:
        [
          time,
          temperature_c,
          precipitation_probability_percent,
          precipitation_mm,
          cloud_cover_percent,
          wind_speed_kph,
          wind_gusts_kph,
          shortwave_radiation_wm2,
          weather_code,
          condition,
        ]
      properties:
        time: { type: string }
        temperature_c: { type: number }
        precipitation_probability_percent: { type: number, minimum: 0, maximum: 100 }
        precipitation_mm: { type: number, minimum: 0 }
        cloud_cover_percent: { type: number, minimum: 0, maximum: 100 }
        wind_speed_kph: { type: number, minimum: 0 }
        wind_gusts_kph: { type: number, minimum: 0 }
        shortwave_radiation_wm2: { type: number, minimum: 0 }
        weather_code: { type: integer }
        condition: { type: string }
    DailyWeather:
      type: object
      additionalProperties: false
      required:
        [
          date,
          temperature_max_c,
          temperature_min_c,
          sunrise,
          sunset,
          precipitation_sum_mm,
          precipitation_probability_max_percent,
          wind_speed_max_kph,
          wind_gusts_max_kph,
          shortwave_radiation_sum_mj_m2,
          weather_code,
          condition,
        ]
      properties:
        date: { type: string, format: date }
        temperature_max_c: { type: number }
        temperature_min_c: { type: number }
        sunrise: { type: string }
        sunset: { type: string }
        precipitation_sum_mm: { type: number, minimum: 0 }
        precipitation_probability_max_percent: { type: number, minimum: 0, maximum: 100 }
        wind_speed_max_kph: { type: number, minimum: 0 }
        wind_gusts_max_kph: { type: number, minimum: 0 }
        shortwave_radiation_sum_mj_m2: { type: number, minimum: 0 }
        weather_code: { type: integer }
        condition: { type: string }
    OperationalAction:
      type: object
      additionalProperties: false
      required: [severity, category, title, reason, timeframe, asset_ids]
      properties:
        severity: { type: string, enum: [info, warning, critical] }
        category: { type: string, enum: [solar, wind, storage, backup] }
        title: { type: string }
        reason: { type: string }
        timeframe: { type: string }
        asset_ids:
          type: array
          items: { type: string }
    OperationalImpact:
      type: object
      additionalProperties: false
      required:
        [
          summary,
          solar_capacity_kw,
          wind_capacity_kw,
          battery_capacity_kwh,
          diesel_capacity_kw,
          actions,
        ]
      properties:
        summary: { type: string }
        solar_capacity_kw: { type: number, minimum: 0 }
        wind_capacity_kw: { type: number, minimum: 0 }
        battery_capacity_kwh: { type: number, minimum: 0 }
        diesel_capacity_kw: { type: number, minimum: 0 }
        actions:
          type: array
          items: { $ref: "#/components/schemas/OperationalAction" }
    WeatherForecast:
      type: object
      additionalProperties: false
      required: [site_id, location, provider, current, hourly, daily, operational_impact]
      properties:
        site_id: { type: string }
        location: { $ref: "#/components/schemas/ForecastLocation" }
        provider: { $ref: "#/components/schemas/ForecastProvider" }
        current: { $ref: "#/components/schemas/CurrentWeather" }
        hourly:
          type: array
          items: { $ref: "#/components/schemas/HourlyWeather" }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyWeather" }
        operational_impact: { $ref: "#/components/schemas/OperationalImpact" }
    ScenarioSummary:
      type: object
      additionalProperties: false
      required: [id, name, site_name, location, revision, horizon, contract_count, event_count]
      properties:
        id: { type: string }
        name: { type: string }
        site_name: { type: string }
        location: { type: string }
        revision: { type: integer, minimum: 1 }
        horizon:
          $ref: "#/components/schemas/PlanningHorizon"
        contract_count: { type: integer, minimum: 0 }
        event_count: { type: integer, minimum: 0 }
    Scenario:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - revision
        - id
        - name
        - description
        - site
        - horizon
        - initial_state
        - signals
        - contracts
        - events
        - operating_policy
      properties:
        schema_version: { type: string, const: "1" }
        revision: { type: integer, minimum: 1, readOnly: true }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        site:
          $ref: "#/components/schemas/Site"
        horizon:
          $ref: "#/components/schemas/PlanningHorizon"
        initial_state:
          $ref: "#/components/schemas/InitialState"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/Contract"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioEvent"
        operating_policy:
          $ref: "#/components/schemas/OperatingPolicy"
    Site:
      type: object
      additionalProperties: false
      required: [id, name, location, timezone, currency, assets, services, connections]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        timezone: { type: string }
        currency: { type: string }
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        connections:
          type: array
          description: Directed power connections. The virtual bus node ID is `controller`.
          items:
            $ref: "#/components/schemas/Connection"
    Connection:
      type: object
      additionalProperties: false
      required: [id, source_id, target_id]
      properties:
        id: { type: string, minLength: 1 }
        source_id: { type: string, minLength: 1 }
        target_id: { type: string, minLength: 1 }
    ConnectionsRequest:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    Asset:
      oneOf:
        - $ref: "#/components/schemas/RenewableAsset"
        - $ref: "#/components/schemas/BatteryAsset"
        - $ref: "#/components/schemas/DieselAsset"
      discriminator:
        propertyName: type
    RenewableAsset:
      type: object
      additionalProperties: false
      required: [id, name, type, capacity_kw]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [solar, wind] }
        capacity_kw: { type: number, exclusiveMinimum: 0 }
    BatteryAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - capacity_kwh
        - minimum_stored_energy_kwh
        - max_charge_kw
        - max_discharge_kw
        - charge_efficiency
        - discharge_efficiency
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, const: battery }
        capacity_kwh: { type: number, exclusiveMinimum: 0 }
        minimum_stored_energy_kwh: { type: number, minimum: 0 }
        max_charge_kw: { type: number, exclusiveMinimum: 0 }
        max_discharge_kw: { type: number, exclusiveMinimum: 0 }
        charge_efficiency: { type: number, exclusiveMinimum: 0, maximum: 1 }
        discharge_efficiency: { type: number, exclusiveMinimum: 0, maximum: 1 }
    DieselAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - minimum_output_kw
        - maximum_output_kw
        - liters_per_kwh
        - fuel_cost_per_liter
        - emissions_kg_co2_per_liter
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, const: diesel }
        minimum_output_kw: { type: number, minimum: 0 }
        maximum_output_kw: { type: number, exclusiveMinimum: 0 }
        liters_per_kwh: { type: number, exclusiveMinimum: 0 }
        startup_fuel_liters: { type: number, minimum: 0 }
        minimum_runtime_minutes: { type: integer, minimum: 0 }
        ramp_rate_kw_per_minute: { type: number, exclusiveMinimum: 0 }
        fuel_cost_per_liter: { type: number, minimum: 0 }
        emissions_kg_co2_per_liter: { type: number, exclusiveMinimum: 0 }
    Service:
      type: object
      additionalProperties: false
      required: [id, name, description, control_mode, rated_power_kw]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        control_mode: { type: string, enum: [fixed, curtailable, shiftable] }
        rated_power_kw: { type: number, exclusiveMinimum: 0 }
    PlanningHorizon:
      type: object
      additionalProperties: false
      required: [starts_at, interval_minutes, interval_count]
      properties:
        starts_at: { type: string, format: date-time }
        interval_minutes: { type: integer, const: 15 }
        interval_count: { type: integer, const: 96 }
    InitialState:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetState"
    AssetState:
      oneOf:
        - $ref: "#/components/schemas/BatteryState"
        - $ref: "#/components/schemas/DieselState"
      discriminator:
        propertyName: type
    BatteryState:
      type: object
      additionalProperties: false
      required: [asset_id, type, stored_energy_kwh]
      properties:
        asset_id: { type: string }
        type: { type: string, const: battery }
        stored_energy_kwh: { type: number, minimum: 0 }
    DieselState:
      type: object
      additionalProperties: false
      required: [asset_id, type, fuel_available_liters, running]
      properties:
        asset_id: { type: string }
        type: { type: string, const: diesel }
        fuel_available_liters: { type: number, minimum: 0 }
        running: { type: boolean }
    Signal:
      oneOf:
        - $ref: "#/components/schemas/RenewableSignal"
        - $ref: "#/components/schemas/ServiceDemandSignal"
        - $ref: "#/components/schemas/FuelDeliverySignal"
      discriminator:
        propertyName: kind
    RenewableSignal:
      type: object
      additionalProperties: false
      required: [id, kind, asset_id, unit, values]
      properties:
        id: { type: string }
        kind: { type: string, const: renewable_availability }
        asset_id: { type: string }
        unit: { type: string, const: kW }
        values:
          $ref: "#/components/schemas/IntervalValues"
    ServiceDemandSignal:
      type: object
      additionalProperties: false
      required: [id, kind, service_id, unit, values]
      properties:
        id: { type: string }
        kind: { type: string, const: service_demand }
        service_id: { type: string }
        unit: { type: string, const: kW }
        values:
          $ref: "#/components/schemas/IntervalValues"
    FuelDeliverySignal:
      type: object
      additionalProperties: false
      required: [id, kind, asset_id, unit, values]
      properties:
        id: { type: string }
        kind: { type: string, const: fuel_delivery }
        asset_id: { type: string }
        unit: { type: string, const: liters }
        values:
          $ref: "#/components/schemas/IntervalValues"
    IntervalValues:
      type: array
      minItems: 96
      maxItems: 96
      items: { type: number, minimum: 0 }
    SignalValuesUpdate:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/IntervalValues"
    Contract:
      oneOf:
        - $ref: "#/components/schemas/ContinuousPowerContract"
        - $ref: "#/components/schemas/RuntimeByDeadlineContract"
        - $ref: "#/components/schemas/EnergyByDeadlineContract"
      discriminator:
        propertyName: kind
    ContractBase:
      type: object
      required: [id, name, service_id, kind, priority, window_start, deadline]
      properties:
        id: { type: string }
        name: { type: string }
        service_id: { type: string }
        kind: { type: string }
        priority: { type: string, enum: [critical, essential, flexible] }
        window_start: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
    ContinuousPowerContract:
      allOf:
        - $ref: "#/components/schemas/ContractBase"
        - type: object
          required: [minimum_power_kw]
          properties:
            kind: { type: string, const: continuous_power }
            minimum_power_kw: { type: number, exclusiveMinimum: 0 }
    RuntimeByDeadlineContract:
      allOf:
        - $ref: "#/components/schemas/ContractBase"
        - type: object
          required: [required_runtime_minutes]
          properties:
            kind: { type: string, const: runtime_by_deadline }
            required_runtime_minutes: { type: integer, exclusiveMinimum: 0 }
    EnergyByDeadlineContract:
      allOf:
        - $ref: "#/components/schemas/ContractBase"
        - type: object
          required: [required_energy_kwh]
          properties:
            kind: { type: string, const: energy_by_deadline }
            required_energy_kwh: { type: number, exclusiveMinimum: 0 }
    ScenarioEvent:
      oneOf:
        - $ref: "#/components/schemas/RenewableShortfallEvent"
        - $ref: "#/components/schemas/DemandSurgeEvent"
        - $ref: "#/components/schemas/FuelDeliveryDelayEvent"
      discriminator:
        propertyName: type
    EventBase:
      type: object
      required: [id, name, type, signal_id]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        signal_id: { type: string }
    RenewableShortfallEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [start, end, availability_multiplier]
          properties:
            type: { type: string, const: renewable_shortfall }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            availability_multiplier: { type: number, minimum: 0, maximum: 1 }
    DemandSurgeEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [start, end, demand_multiplier]
          properties:
            type: { type: string, const: demand_surge }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            demand_multiplier: { type: number, minimum: 1 }
    FuelDeliveryDelayEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [scheduled_at, delayed_until]
          properties:
            type: { type: string, const: fuel_delivery_delay }
            scheduled_at: { type: string, format: date-time }
            delayed_until: { type: string, format: date-time }
    OperatingPolicy:
      type: object
      additionalProperties: false
      required: [reserve_energy_kwh, assumed_loss_percent]
      properties:
        reserve_energy_kwh: { type: number, minimum: 0 }
        assumed_loss_percent: { type: number, minimum: 0, exclusiveMaximum: 1 }
    PlanningRequest:
      type: object
      additionalProperties: false
      required: [scenario_id, planner, active_event_ids]
      properties:
        scenario_id: { type: string }
        planner: { type: string, enum: [baseline, wattson] }
        active_event_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        parent_run_id: { type: string }
    PlanRun:
      type: object
      additionalProperties: false
      required:
        - id
        - scenario_id
        - scenario_revision
        - scenario_snapshot_hash
        - planner
        - status
        - created_at
        - active_event_ids
        - intervals
        - contract_outcomes
        - decisions
        - summary
      properties:
        id: { type: string }
        scenario_id: { type: string }
        scenario_revision: { type: integer, minimum: 1 }
        scenario_snapshot_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        parent_run_id: { type: string }
        planner: { type: string, enum: [baseline, wattson] }
        status: { type: string, enum: [computing, complete, infeasible, failed] }
        created_at: { type: string, format: date-time }
        active_event_ids:
          type: array
          items: { type: string }
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/PlanInterval"
        contract_outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ContractOutcome"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        summary:
          $ref: "#/components/schemas/PlanSummary"
        comparison:
          $ref: "#/components/schemas/PlanComparison"
    PlanInterval:
      type: object
      additionalProperties: false
      required:
        - index
        - start
        - end
        - renewables
        - batteries
        - generators
        - services
        - contracts
        - losses_kw
        - dumped_power_kw
        - diesel_cost
        - emissions_kg_co2
        - unserved_energy_kwh
        - decision_ids
      properties:
        index: { type: integer, minimum: 0 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        renewables:
          type: array
          items:
            $ref: "#/components/schemas/RenewableDispatch"
        batteries:
          type: array
          items:
            $ref: "#/components/schemas/BatteryDispatch"
        generators:
          type: array
          items:
            $ref: "#/components/schemas/GeneratorDispatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceDelivery"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractState"
        losses_kw: { type: number, minimum: 0 }
        dumped_power_kw: { type: number, minimum: 0 }
        diesel_cost: { type: number, minimum: 0 }
        emissions_kg_co2: { type: number, minimum: 0 }
        unserved_energy_kwh: { type: number, minimum: 0 }
        decision_ids:
          type: array
          items: { type: string }
    RenewableDispatch:
      type: object
      additionalProperties: false
      required: [asset_id, available_kw, used_kw, curtailed_kw]
      properties:
        asset_id: { type: string }
        available_kw: { type: number, minimum: 0 }
        used_kw: { type: number, minimum: 0 }
        curtailed_kw: { type: number, minimum: 0 }
    BatteryDispatch:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - starting_energy_kwh
        - charge_kw
        - discharge_kw
        - ending_energy_kwh
        - reserve_energy_kwh
      properties:
        asset_id: { type: string }
        starting_energy_kwh: { type: number, minimum: 0 }
        charge_kw: { type: number, minimum: 0 }
        discharge_kw: { type: number, minimum: 0 }
        ending_energy_kwh: { type: number, minimum: 0 }
        reserve_energy_kwh: { type: number, minimum: 0 }
    GeneratorDispatch:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - output_kw
        - running
        - started
        - fuel_used_liters
        - startup_fuel_liters
        - fuel_remaining_liters
      properties:
        asset_id: { type: string }
        output_kw: { type: number, minimum: 0 }
        running: { type: boolean }
        started: { type: boolean }
        fuel_used_liters: { type: number, minimum: 0 }
        startup_fuel_liters: { type: number, minimum: 0 }
        fuel_remaining_liters: { type: number, minimum: 0 }
    ServiceDelivery:
      type: object
      additionalProperties: false
      required: [service_id, requested_kw, delivered_kw, deferred_kw, unserved_kw]
      properties:
        service_id: { type: string }
        requested_kw: { type: number, minimum: 0 }
        delivered_kw: { type: number, minimum: 0 }
        deferred_kw: { type: number, minimum: 0 }
        unserved_kw: { type: number, minimum: 0 }
    ContractState:
      type: object
      additionalProperties: false
      required: [contract_id, status, delivered_energy_kwh, delivered_runtime_minutes]
      properties:
        contract_id: { type: string }
        status: { type: string, enum: [safe, at_risk, met, breached] }
        delivered_energy_kwh: { type: number, minimum: 0 }
        delivered_runtime_minutes: { type: integer, minimum: 0 }
        remaining_energy_kwh: { type: number, minimum: 0 }
        remaining_runtime_minutes: { type: integer, minimum: 0 }
    ContractOutcome:
      type: object
      additionalProperties: false
      required:
        - contract_id
        - status
        - delivered_energy_kwh
        - delivered_runtime_minutes
        - shortfall
      properties:
        contract_id: { type: string }
        status: { type: string, enum: [met, breached] }
        delivered_energy_kwh: { type: number, minimum: 0 }
        delivered_runtime_minutes: { type: integer, minimum: 0 }
        shortfall: { type: number, minimum: 0 }
        first_risk_interval: { type: integer, minimum: 0 }
    Decision:
      type: object
      additionalProperties: false
      required:
        - id
        - interval_index
        - kind
        - title
        - reason
        - affected_service_ids
        - affected_contract_ids
        - baseline_difference
      properties:
        id: { type: string }
        interval_index: { type: integer, minimum: 0 }
        kind: { type: string }
        title: { type: string }
        reason: { type: string }
        affected_service_ids:
          type: array
          items: { type: string }
        affected_contract_ids:
          type: array
          items: { type: string }
        baseline_difference: { type: string }
    PlanSummary:
      type: object
      additionalProperties: false
      required:
        - contracts_met
        - contracts_breached
        - renewable_energy_kwh
        - diesel_energy_kwh
        - unserved_energy_kwh
        - total_diesel_cost
        - total_emissions_kg_co2
        - minimum_battery_energy_kwh
      properties:
        contracts_met: { type: integer, minimum: 0 }
        contracts_breached: { type: integer, minimum: 0 }
        renewable_energy_kwh: { type: number, minimum: 0 }
        diesel_energy_kwh: { type: number, minimum: 0 }
        unserved_energy_kwh: { type: number, minimum: 0 }
        total_diesel_cost: { type: number, minimum: 0 }
        total_emissions_kg_co2: { type: number, minimum: 0 }
        minimum_battery_energy_kwh: { type: number, minimum: 0 }
    ComparisonMetric:
      type: object
      additionalProperties: false
      required: [baseline, candidate, delta]
      properties:
        baseline: { type: number }
        candidate: { type: number }
        delta: { type: number }
    ComparisonCount:
      type: object
      additionalProperties: false
      required: [baseline, candidate, delta]
      properties:
        baseline: { type: integer }
        candidate: { type: integer }
        delta: { type: integer }
    ComparisonSummary:
      type: object
      additionalProperties: false
      required:
        - contracts_met
        - contracts_breached
        - contract_shortfall
        - renewable_energy_kwh
        - diesel_energy_kwh
        - delivered_energy_kwh
        - deferred_energy_kwh
        - unserved_energy_kwh
        - total_diesel_cost
        - total_emissions_kg_co2
        - minimum_battery_energy_kwh
      properties:
        contracts_met: { $ref: "#/components/schemas/ComparisonCount" }
        contracts_breached: { $ref: "#/components/schemas/ComparisonCount" }
        contract_shortfall: { $ref: "#/components/schemas/ComparisonMetric" }
        renewable_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        diesel_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        delivered_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        deferred_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        unserved_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        total_diesel_cost: { $ref: "#/components/schemas/ComparisonMetric" }
        total_emissions_kg_co2: { $ref: "#/components/schemas/ComparisonMetric" }
        minimum_battery_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
    PlanComparison:
      type: object
      additionalProperties: false
      required:
        - baseline_run_id
        - candidate_run_id
        - summary
        - contracts
        - services
        - renewables
        - batteries
        - generators
        - intervals
      properties:
        baseline_run_id: { type: string }
        candidate_run_id: { type: string }
        summary: { $ref: "#/components/schemas/ComparisonSummary" }
        contracts:
          type: array
          items: { $ref: "#/components/schemas/ContractComparison" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceComparison" }
        renewables:
          type: array
          items: { $ref: "#/components/schemas/RenewableComparison" }
        batteries:
          type: array
          items: { $ref: "#/components/schemas/BatteryComparison" }
        generators:
          type: array
          items: { $ref: "#/components/schemas/GeneratorComparison" }
        intervals:
          type: array
          items: { $ref: "#/components/schemas/IntervalComparison" }
    ContractComparison:
      type: object
      additionalProperties: false
      required:
        [
          contract_id,
          baseline_present,
          candidate_present,
          status_change,
          delivered_energy_kwh,
          delivered_runtime_minutes,
          shortfall,
        ]
      properties:
        contract_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        baseline_status: { type: string, enum: [safe, at_risk, met, breached] }
        candidate_status: { type: string, enum: [safe, at_risk, met, breached] }
        status_change: { type: string }
        delivered_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        delivered_runtime_minutes: { $ref: "#/components/schemas/ComparisonCount" }
        shortfall: { $ref: "#/components/schemas/ComparisonMetric" }
        baseline_first_risk_interval: { type: integer, minimum: 0 }
        candidate_first_risk_interval: { type: integer, minimum: 0 }
    ServiceComparison:
      type: object
      additionalProperties: false
      required:
        [
          service_id,
          baseline_present,
          candidate_present,
          requested_energy_kwh,
          delivered_energy_kwh,
          deferred_energy_kwh,
          unserved_energy_kwh,
        ]
      properties:
        service_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        requested_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        delivered_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        deferred_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        unserved_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
    RenewableComparison:
      type: object
      additionalProperties: false
      required:
        [
          asset_id,
          baseline_present,
          candidate_present,
          available_energy_kwh,
          used_energy_kwh,
          curtailed_energy_kwh,
        ]
      properties:
        asset_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        available_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        used_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        curtailed_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
    BatteryComparison:
      type: object
      additionalProperties: false
      required:
        [
          asset_id,
          baseline_present,
          candidate_present,
          charge_energy_kwh,
          discharge_energy_kwh,
          minimum_energy_kwh,
          ending_energy_kwh,
        ]
      properties:
        asset_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        charge_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        discharge_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        minimum_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        ending_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
    GeneratorComparison:
      type: object
      additionalProperties: false
      required:
        [
          asset_id,
          baseline_present,
          candidate_present,
          output_energy_kwh,
          fuel_used_liters,
          fuel_remaining_liters,
          diesel_cost,
          emissions_kg_co2,
        ]
      properties:
        asset_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        output_energy_kwh: { $ref: "#/components/schemas/ComparisonMetric" }
        fuel_used_liters: { $ref: "#/components/schemas/ComparisonMetric" }
        fuel_remaining_liters: { $ref: "#/components/schemas/ComparisonMetric" }
        diesel_cost: { $ref: "#/components/schemas/ComparisonMetric" }
        emissions_kg_co2: { $ref: "#/components/schemas/ComparisonMetric" }
    ContractStatusChange:
      type: object
      additionalProperties: false
      required: [contract_id, baseline_present, candidate_present, status_change]
      properties:
        contract_id: { type: string }
        baseline_present: { type: boolean }
        candidate_present: { type: boolean }
        baseline_status: { type: string, enum: [safe, at_risk, met, breached] }
        candidate_status: { type: string, enum: [safe, at_risk, met, breached] }
        status_change: { type: string }
    IntervalComparison:
      type: object
      additionalProperties: false
      required:
        [
          index,
          start,
          end,
          supply_kw,
          demand_kw,
          delivered_kw,
          deferred_kw,
          unserved_kw,
          renewable_kw,
          renewable_used_kw,
