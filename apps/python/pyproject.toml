[project]
name = "getficksd-python"
version = "0.1.0"
description = "Optional FastAPI service for data processing and ML workloads"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0,<1",
  "numpy>=2.2.0,<3",
  "pandas>=2.2.0,<4",
  "pydantic-settings>=2.10.0,<3",
  "scikit-learn>=1.7.0,<2",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = ["httpx>=0.28.0,<1", "pytest>=8.4.0,<9", "ruff>=0.12.0,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
