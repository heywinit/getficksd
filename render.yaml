services:
  - type: web
    name: getficksd-python
    runtime: python
    rootDir: apps/python
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: WEB_ORIGINS
        sync: false
